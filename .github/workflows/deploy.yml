name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to deploy'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.version_tag || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish the App
      run: dotnet publish DevPlanTracker/DevPlanTracker.csproj -c Release -o out --nologo

    - name: Fix GitHub Pages Compatibility
      run: |
        TARGET_DIR="out/wwwroot"
        
        # 1. Force creation of .nojekyll (using -f to ensure it happens)
        touch $TARGET_DIR/.nojekyll
        
        # 2. Fix Base Href
        sed -i 's|<base href="/"|<base href="/DevPlanTracker/"|g' $TARGET_DIR/index.html
        
        # 3. Fix Fingerprinted Filenames (The "dotnet.js" 404 Fix)
        # .NET 10 adds hashes to filenames. We must update index.html to point to the real files.
        REAL_BLAZOR_JS=$(basename $(ls $TARGET_DIR/_framework/blazor.webassembly.*.js))
        sed -i "s|blazor.webassembly.js|$REAL_BLAZOR_JS|g" $TARGET_DIR/index.html
        
        # 4. Create 404.html
        cp $TARGET_DIR/index.html $TARGET_DIR/404.html

    - name: Verify Deployment Folder (CRITICAL LOG)
      # Using -la to show HIDDEN files like .nojekyll
      run: |
        echo "Checking root of deployment:"
        ls -la out/wwwroot
        echo "Checking index.html content for base href:"
        grep "base href" out/wwwroot/index.html

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'out/wwwroot'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4