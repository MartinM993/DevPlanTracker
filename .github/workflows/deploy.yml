name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to deploy (e.g., v0.0.7). Leave blank to deploy latest.'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.version_tag || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish the App
      run: dotnet publish DevPlanTracker/DevPlanTracker.csproj -c Release -o release --nologo

    - name: Fix GitHub Pages Compatibility
      run: |
        # 1. Update Base Href
        sed -i 's|<base href="/"|<base href="/DevPlanTracker/"|g' release/wwwroot/index.html
        
        # 2. Add Cache Buster
        sed -i 's|blazor.webassembly.js|blazor.webassembly.js?v=${{ github.run_id }}|g' release/wwwroot/index.html
        
        # 3. CREATE THE NOJEKYLL FILE (Crucial)
        touch release/wwwroot/.nojekyll
        
        # 4. Create 404.html for SPA routing
        cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4