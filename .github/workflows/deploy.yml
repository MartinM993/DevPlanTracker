name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to deploy'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.version_tag || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish the App
      run: dotnet publish DevPlanTracker/DevPlanTracker.csproj -c Release -o out --nologo

    - name: Fix GitHub Pages Compatibility
      run: |
        TARGET_DIR="out/wwwroot"
        
        # 1. Fix Base Href
        sed -i 's|<base href="/"|<base href="/DevPlanTracker/"|g' $TARGET_DIR/index.html
        
        # 2. Map the fingerprinted JS filename
        REAL_JS=$(ls $TARGET_DIR/_framework/blazor.webassembly.*.js | xargs -n 1 basename)
        sed -i "s|blazor.webassembly.js|$REAL_JS|g" $TARGET_DIR/index.html
        
        # 3. THE CRITICAL FIX: Tell the JS loader where the framework is
        # We find the 'dotnet.js' references inside the Blazor script and make them relative
        sed -i 's|"/_framework/"|"_framework/"|g' $TARGET_DIR/_framework/$REAL_JS
        
        # 4. Create .nojekyll (Force it)
        touch $TARGET_DIR/.nojekyll
        
        # 5. Create 404.html
        cp $TARGET_DIR/index.html $TARGET_DIR/404.html

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'out/wwwroot'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4